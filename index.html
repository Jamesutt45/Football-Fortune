<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Fortune</title>
<style>html,body{margin:0;min-height:100%;background:#e8eef3;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#14324e;font-weight:800}</style>
</head>
<body>
<div class="loading">Loading Football Fortune…</div>
<script>
(async()=>{
  const version='20261006-1535';
  const files=["deploy/v132-001.part","deploy/v132-002.part","deploy/v132-003.part","deploy/v132-004.part","deploy/v132-005.part","deploy/v132-006.part","deploy/v132-007.part","deploy/v132-008.part","deploy/v132-009.part","deploy/v132-010.part","deploy/v132-011.part","deploy/v132-012.part","deploy/v132-013.part","deploy/v132-014.part","deploy/v132-015.part","deploy/v132-016.part","deploy/v132-017.part","deploy/v132-018.part","deploy/v132-019.part","deploy/v132-020.part"];
  try{
    const parts=[];
    for(const file of files){
      const r=await fetch(file+'?v='+version,{cache:'reload'});
      if(!r.ok) throw new Error(file+' '+r.status);
      parts.push(await r.text());
    }
    let html=parts.join('');
    const cloudAuth='<script src="supabase-config.js?v=4"></scr'+'ipt><script src="football-fortune-auth.js?v=4"></scr'+'ipt>';
    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,cloudAuth+'</body>');
    else html+=cloudAuth;
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading">Football Fortune could not load. Please refresh.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
